<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Play Havilering Online - in development</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="/src/main.ts" defer></script>
    <meta name="description" content="Play Havilering Online is a place to play
        the trick-taking card game Havilering against bot players
        in-browser.">
</head>

<body>
    <div id="new-game-button">New game</div>
    <div id="new-game-menu" hidden>
        <form id="new-game-form">
            <fieldset>
                <legend>Target Score</legend>
                <input type="radio" name="targetscore" value="61" id="targetscore-61">
                <label for="targetscore-61">61</label>
                <input type="radio" name="targetscore" value="121" id="targetscore-121">
                <label for="targetscore-121">121</label>
                <input type="radio" name="targetscore" value="181" id="targetscore-181">
                <label for="targetscore-181">181</label>
                <input type="radio" name="targetscore" value="241" id="targetscore-241">
                <label for="targetscore-241">241</label>
                <input type="radio" name="targetscore" value="301" id="targetscore-301">
                <label for="targetscore-301">301</label>

            </fieldset>

            <fieldset>
                <legend>Number of Players</legend>
                <input type="radio" name="numplayers" value="4" id="numplayers-4">
                <label for="numplayers-4">4</label>
                <input type="radio" name="numplayers" value="6" id="numplayers-6">
                <label for="numplayers-6">6</label>
            </fieldset>

            <button type="submit" id="play-now">Play Now</button>
        </form>
    </div>

    <div class="trumps" id="trump-holder"></div>

    <div class="config" id="config"></div>
    <div class="hand-number" id="hand-number"></div>
    <div class="scores-container">
        <div class="scores" id="scores">
            <span id="scores-breakdown"></span>
            <table class="scores-table" id="scores-table"></table>
        </div>
    </div>

    <div id="game-board" class="game-board">
    </div>

    <div id="previous-trick" class="previous-trick">
        <div id="prev-area" class="prev-area">
        </div>
    </div>
    <div id="cachette"></div>

    <div class="hand">
        <div id="player-hand"></div>
    </div>

</body>

</html>
